{% extends "base.html" %}
{% block title %}Sign in · {{ app_name }}{% endblock %}

{% block bare %}
<div class="login-page">
  <form method="post" action="/login" class="login-card" autocomplete="on">
    <div class="login-header">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 2 7 12 12 22 7 12 2" fill="currentColor" fill-opacity="0.25"/>
          <polyline points="2 17 12 22 22 17"/>
          <polyline points="2 12 12 17 22 12"/>
        </svg>
      </div>
      <h1 class="login-title">{{ app_name }}</h1>
      <p class="login-subtitle muted">Sign in to manage your server</p>
    </div>

    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}

    <div class="login-fields">
      <div>
        <label for="username">Username</label>
        <div class="input-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" name="username" required autofocus
                 autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="Enter username">
        </div>
      </div>

      <div>
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" required
                 autocomplete="current-password" placeholder="••••••••••••">
        </div>
      </div>
    </div>

    <button type="submit" class="button primary login-submit">Sign in</button>

    <div class="login-foot muted">
      <span>Self-hosted &amp; secure</span>
    </div>
  </form>
</div>
{% endblock %}
