{% extends "base.html" %}
{% block title %}Terminal · {{ app_name }}{% endblock %}

{% block content %}
<link rel="stylesheet" href="/static/vendor/xterm/xterm.css">
<style>
  /* This page wants the terminal to fill the available space rather than
     sit inside the normal content flow, so it overrides just enough of the
     shared layout locally rather than changing base.html for one page. */
  .terminal-wrap {
    height: calc(100vh - 210px);
    min-height: 420px;
    max-height: 720px;
    background: #0d0f12;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    position: relative;
  }
  #terminal-container { height: 100%; width: 100%; }
  .terminal-banner {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(13, 15, 18, 0.92);
    color: #d6dae0;
    font: 13px var(--mono);
    text-align: center;
    padding: 24px;
    border-radius: var(--radius);
  }
  .terminal-banner.visible { display: flex; }
  .terminal-banner a { color: var(--accent); }
</style>

<header class="page-head">
  <h1>Terminal</h1>
  <p class="muted">A real root shell on this server. Closes automatically after
    {{ idle_timeout_minutes }} minutes of inactivity.</p>
</header>

<div class="terminal-wrap">
  <div id="terminal-container"></div>
  <div id="terminal-banner" class="terminal-banner"></div>
</div>

<script src="/static/vendor/xterm/xterm.js"></script>
<script src="/static/vendor/xterm/addon-fit.js"></script>
<script src="/static/terminal.js"></script>
{% endblock %}
